<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Resume Document Silhouette -->
  <rect x="30" y="24" width="68" height="80" rx="10" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Document Fold Corner / Accent -->
  <path d="M78 24 L98 44 L78 44 Z" fill="#e0e7ff" />

  <!-- Document Header Lines -->
  <rect x="40" y="36" width="30" height="5" rx="2.5" fill="#4f46e5" />
  
  <!-- Resume Content Bullet Lines -->
  <rect x="40" y="52" width="48" height="4" rx="2" fill="#94a3b8" />
  <rect x="40" y="62" width="42" height="4" rx="2" fill="#cbd5e1" />
  <rect x="40" y="72" width="48" height="4" rx="2" fill="#94a3b8" />
  <rect x="40" y="82" width="36" height="4" rx="2" fill="#cbd5e1" />

  <!-- Floating Green Checkmark Badge -->
  <circle cx="92" cy="92" r="18" fill="#10b981" stroke="#ffffff" stroke-width="3" />
  <path d="M85 92 L90 97 L99 87" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

